# folders read at boot (comma separated, resolved at runtime; they are NOT inside the binary)
mq.resources.dirs=${MQ_RESOURCES_DIRS:../shared-resources/valid,../shared-resources/invalid}
quarkus.http.port=${PORT:8080}

# Needed by the native image (found by the first native run, see evidence/run1-native-startup-failure.log):
# the JDK reports malformed XML through this resource bundle, which native-image does not include by default
quarkus.native.additional-build-args=-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages
