# One YAML file, read by Quarkus: datasources (one default, one named), migrations, security, CORS, limits, OpenAPI, metrics.
quarkus:
  datasource:
    db-kind: postgresql
    username: postgres
    password: ${DB_PASSWORD:postgres}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/main}
    reports:
      db-kind: postgresql
      username: postgres
      password: ${DB_PASSWORD:postgres}
      jdbc:
        url: ${REPORTS_URL:jdbc:postgresql://localhost:5432/reports}
  flyway:
    migrate-at-start: true
    locations:
      - classpath:db/migration
  http:
    port: ${PORT:8080}
    limits:
      max-body-size: 1M
    cors:
      enabled: true
      origins: https://app.example
    auth:
      permission:
        secured:
          paths: /secure/*
          policy: authenticated
  smallrye-openapi:
    path: /openapi
  scheduler:
    enabled: true

mp:
  jwt:
    verify:
      publickey: ${JWT_PUBLIC_KEY}
      issuer: https://id.example
  openapi:
    model:
      reader: io.mq.leverage.MqOpenApi
