# folder with one sub folder per backend, each holding a backend.yaml (read at runtime, not part of the image)
mq.backends.dir=${MQ_BACKENDS_DIR:sample-backends}
quarkus.http.port=${PORT:8080}

# HSQLDB reads internal scripts and message bundles from its jar; a native image only has resources that are listed
# (first native run: NullPointerException in LobManager.createSchema, see evidence/)
quarkus.native.resources.includes=org/hsqldb/resources/*
