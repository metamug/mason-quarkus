quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:mq;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:init.sql'
quarkus.datasource.jdbc.max-size=8

# init.sql is read through the classpath by the H2 INIT=RUNSCRIPT option; native images only contain resources that are listed
quarkus.native.resources.includes=init.sql
