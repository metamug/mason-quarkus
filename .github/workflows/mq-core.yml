name: mq-core

on:
  push:
    paths: ['mq-core/**', 'golden/**', 'tools/xsd-oracle/**', '.github/workflows/mq-core.yml']
  pull_request:
    paths: ['mq-core/**', 'golden/**', 'tools/xsd-oracle/**', '.github/workflows/mq-core.yml']
  workflow_dispatch:

jobs:
  jvm:
    name: JVM tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Golden test suite
        working-directory: mq-core
        run: mvn -B -ntp test

  native:
    name: Native parity (Mandrel 25, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: mandrel
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Runner
        run: |
          nproc; free -m; java -version 2>&1; native-image --version
      - name: Build the jar classes
        working-directory: mq-core
        run: mvn -B -ntp -DskipTests package
      - name: Build the native validator
        run: |
          mkdir -p out
          /usr/bin/time -v -o out/native-build-time.txt \
            native-image --no-fallback -cp mq-core/target/classes io.mq.core.Validate -o out/validate
          grep -E "Elapsed|Maximum resident" out/native-build-time.txt
          ls -l out/validate
      - name: Same output as the JVM, same as golden/expected.tsv
        run: |
          set +e
          out/validate golden/valid golden/invalid > out/native.tsv; echo "native exit $?"
          java -cp mq-core/target/classes io.mq.core.Validate golden/valid golden/invalid > out/jvm.tsv; echo "jvm exit $?"
          set -e
          wc -l out/native.tsv out/jvm.tsv
          diff out/jvm.tsv out/native.tsv
          diff golden/expected.tsv out/native.tsv
          echo "native == jvm == expected.tsv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mq-core-native-results
          path: out/*.tsv
