name: mq-engine

on:
  push:
    paths: ['mq-core/**', 'mq-engine/**', 'samples/**', '.github/workflows/mq-engine.yml']
  pull_request:
    paths: ['mq-core/**', 'mq-engine/**', 'samples/**', '.github/workflows/mq-engine.yml']
  workflow_dispatch:

jobs:
  hsqldb:
    name: Shop SQL scenario on HSQLDB (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp install -pl mq-core,mq-engine -am

  postgresql:
    name: Shop SQL scenario on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mqtest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Same tests against PostgreSQL
        env:
          MQ_TEST_PG_URL: jdbc:postgresql://localhost:5432/mqtest
          MQ_TEST_PG_USER: postgres
          MQ_TEST_PG_PASSWORD: postgres
        run: mvn -B -ntp install -pl mq-core,mq-engine -am
