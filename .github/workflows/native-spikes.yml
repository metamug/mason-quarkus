# THROWAWAY: measures the spikes on a Linux runner with Mandrel (no GraalVM is installed on developer machines).
name: native-spikes (throwaway)

on:
  workflow_dispatch:

jobs:
  spike2-native-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: mandrel
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Runner and toolchain
        run: |
          mkdir -p out
          {
            echo "## Runner"
            echo '```'
            uname -a; echo "cpus: $(nproc)"; free -m; df -h / | tail -1
            echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
            java -version 2>&1; native-image --version 2>&1 | head -2; mvn -v | head -1
            echo '```'
          } | tee out/runner.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build shared parser and the app (JVM)
        run: |
          mvn -B -q -f spikes/shared-parser install
          mvn -B -q -f spikes/spike2-native-parse package -DskipTests

      - name: Run on the JVM, capture
        working-directory: spikes/spike2-native-parse
        run: |
          (java -jar target/quarkus-app/quarkus-run.jar > ../../out/jvm-run.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8080/status > ../../out/jvm-status.json && break; sleep 1; done
          curl -sf localhost:8080/results > ../../out/jvm-results.txt
          cat ../../out/jvm-status.json
          pkill -f quarkus-run.jar || true

      - name: Build the native image
        working-directory: spikes/spike2-native-parse
        run: |
          /usr/bin/time -v mvn -B package -Dnative -DskipTests -Dquarkus.native.enable-reports=true \
            > ../../out/native-build.log 2> ../../out/native-build-time.txt
          grep -E "Elapsed \(wall clock\)|Maximum resident" ../../out/native-build-time.txt | tee ../../out/native-build-summary.txt
          ls -l target/*-runner | tee ../../out/native-size.txt
          grep -E "reflect|Reflection" ../../out/native-build.log | head -20 > ../../out/native-reflection-mentions.txt || true
          ls src/main/resources/META-INF/native-image 2>/dev/null || echo "no native-image config files in the project" | tee -a ../../out/native-size.txt

      - name: Run the native binary, resources read from a folder outside the binary
        working-directory: spikes/spike2-native-parse
        run: |
          mkdir -p /tmp/mq-res && cp -r ../shared-resources/valid ../shared-resources/invalid /tmp/mq-res/
          START=$(date +%s%N)
          MQ_RESOURCES_DIRS=/tmp/mq-res/valid,/tmp/mq-res/invalid ./target/spike2-native-parse-1.0.0-SNAPSHOT-runner > ../../out/native-run.log 2>&1 &
          NATIVE_PID=$!
          for i in $(seq 1 200); do curl -sf localhost:8080/status > ../../out/native-status.json && break; sleep 0.05; done
          END=$(date +%s%N)
          echo "process start to first successful /status: $(( (END-START)/1000000 )) ms" | tee ../../out/native-first-response.txt
          curl -sf localhost:8080/results > ../../out/native-results.txt
          cat ../../out/native-status.json
          ps -o rss= -p "$NATIVE_PID" | tee ../../out/native-rss-kb.txt
          kill "$NATIVE_PID" || true

      - name: XML parser code in the native binary (rough, from strings)
        run: |
          echo "runtime-parse: $(strings -a spikes/spike2-native-parse/target/spike2-native-parse-1.0.0-SNAPSHOT-runner | grep -cE 'XMLStreamReader|xerces') matching strings" | tee out/runtime-xml-strings.txt

      - name: Compare JVM and native
        run: |
          cd out
          if diff -u jvm-results.txt native-results.txt > results-diff.txt; then echo "IDENTICAL results for $(wc -l < jvm-results.txt) files" | tee compare.txt; else echo "DIFFERENT" | tee compare.txt; cat results-diff.txt; exit 1; fi
          {
            echo "## Spike 2: StAX parser + validator, JVM vs native"
            echo '```'
            echo "JVM:    $(cat jvm-status.json)"
            echo "native: $(cat native-status.json)"
            cat native-first-response.txt compare.txt native-build-summary.txt native-size.txt
            echo "native RSS after boot (kB): $(cat native-rss-kb.txt)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike2-results
          path: |
            out/
            spikes/spike2-native-parse/target/*-native-image-source-jar/reports/
          if-no-files-found: warn

  spike3-baked-native:
    # Spike 2 second boot measurement / Spike 3 question C: the same 20 resources baked into the image at build time
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: mandrel
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared parser, extension, app (JVM)
        run: |
          mkdir -p out
          mvn -B -q -f spikes/shared-parser install
          mvn -B -q -f spikes/spike3-baking-variant/quarkus-mq install -DskipTests
          mvn -B -q -f spikes/spike3-baking-variant/app package -DskipTests

      - name: Run baked on the JVM
        working-directory: spikes/spike3-baking-variant/app
        run: |
          java -Dquarkus.http.port=8081 -jar target/quarkus-app/quarkus-run.jar > ../../../out/baked-jvm-run.log 2>&1 &
          PID=$!
          for i in $(seq 1 100); do curl -sf localhost:8081/v1.0/hello > ../../../out/baked-jvm-hello.txt && break; sleep 0.1; done
          ps -o rss= -p "$PID" | tee ../../../out/baked-jvm-rss-kb.txt
          grep -o "started in [0-9.]*s" ../../../out/baked-jvm-run.log | tee ../../../out/baked-jvm-started.txt
          kill "$PID" || true

      - name: Build the baked native image
        working-directory: spikes/spike3-baking-variant/app
        run: |
          /usr/bin/time -v mvn -B package -Dnative -DskipTests > ../../../out/baked-native-build.log 2> ../../../out/baked-native-build-time.txt
          grep -E "Elapsed \(wall clock\)|Maximum resident" ../../../out/baked-native-build-time.txt | tee ../../../out/baked-native-build-summary.txt
          ls -l target/*-runner | tee ../../../out/baked-native-size.txt

      - name: Run the baked native binary
        working-directory: spikes/spike3-baking-variant/app
        run: |
          START=$(date +%s%N)
          ./target/app-1.0.0-SNAPSHOT-runner -Dquarkus.http.port=8081 > ../../../out/baked-native-run.log 2>&1 &
          PID=$!
          for i in $(seq 1 200); do curl -sf localhost:8081/v1.0/hello > ../../../out/baked-native-hello.txt && break; sleep 0.05; done
          END=$(date +%s%N)
          echo "process start to first successful response: $(( (END-START)/1000000 )) ms" | tee ../../../out/baked-native-first-response.txt
          ps -o rss= -p "$PID" | tee ../../../out/baked-native-rss-kb.txt
          grep -o "started in [0-9.]*s" ../../../out/baked-native-run.log | tee ../../../out/baked-native-started.txt
          cat ../../../out/baked-native-hello.txt
          kill "$PID" || true

      - name: XML parser code in the native binary (rough, from strings)
        run: |
          echo "baked    : $(strings -a spikes/spike3-baking-variant/app/target/app-1.0.0-SNAPSHOT-runner | grep -c 'XMLStreamReader\|xerces') matching strings" | tee out/baked-xml-strings.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike3-baked-results
          path: out/
          if-no-files-found: warn

  spike3-hosting:
    # Spike 3: question A (several backends: separate processes vs one process) and question B (datasources from backend.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # throwaway database that only exists inside this job; named in backend.yaml and resolved from the environment at boot
      DB_HOST: localhost
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: mandrel
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (JVM)
        working-directory: spikes/spike3-hosting
        run: |
          mkdir -p ../../out
          mvn -B -q package -DskipTests

      - name: Question B on the JVM, and question A option 2 (one process, many backends)
        working-directory: spikes/spike3-hosting
        run: |
          java -jar target/quarkus-app/quarkus-run.jar > ../../out/hosting-jvm-run.log 2>&1 &
          PID=$!
          for i in $(seq 1 100); do curl -sf localhost:8080/mem > /dev/null && break; sleep 0.2; done
          {
            echo "== datasources from backend.yaml, JVM"
            curl -s localhost:8080/ds/pg; echo
            curl -s localhost:8080/ds/hsql; echo
            echo "== one process, many backends (add 20, then remove 20)"
            curl -s localhost:8080/mem; echo
            for n in $(seq 1 20); do curl -s -X POST localhost:8080/admin/b$n > /dev/null; done
            curl -s localhost:8080/b/b7/ping; echo
            curl -s localhost:8080/mem; echo
            for n in $(seq 1 20); do curl -s -X DELETE localhost:8080/admin/b$n > /dev/null; done
            curl -s -o /dev/null -w "ping after remove: %{http_code}\n" localhost:8080/b/b7/ping
            curl -s localhost:8080/admin/unload-check; echo
            curl -s localhost:8080/mem; echo
          } | tee ../../out/hosting-jvm.txt
          kill $PID || true

      - name: Question A option 1 on the JVM (N separate processes)
        working-directory: spikes/spike3-hosting
        run: |
          for n in 1 5 20; do bash ci/processes.sh jvm $n; done | tee ../../out/processes-jvm.txt

      - name: Build the native image
        working-directory: spikes/spike3-hosting
        run: |
          /usr/bin/time -v mvn -B package -Dnative -DskipTests > ../../out/hosting-native-build.log 2> ../../out/hosting-native-build-time.txt || echo "NATIVE BUILD FAILED" | tee ../../out/hosting-native-build-failed.txt
          grep -E "Elapsed \(wall clock\)|Maximum resident" ../../out/hosting-native-build-time.txt | tee ../../out/hosting-native-build-summary.txt
          ls -l target/*-runner 2>&1 | tee ../../out/hosting-native-size.txt

      - name: Question B in native
        working-directory: spikes/spike3-hosting
        run: |
          if [ ! -x target/spike3-hosting-1.0.0-SNAPSHOT-runner ]; then echo "no native binary"; exit 0; fi
          ./target/spike3-hosting-1.0.0-SNAPSHOT-runner > ../../out/hosting-native-run.log 2>&1 &
          PID=$!
          for i in $(seq 1 100); do curl -sf localhost:8080/mem > /dev/null && break; sleep 0.2; done
          {
            echo "== datasources from backend.yaml, native"
            curl -s localhost:8080/ds/pg; echo
            curl -s localhost:8080/ds/hsql; echo
            curl -s localhost:8080/mem; echo
          } | tee ../../out/hosting-native.txt
          kill $PID || true

      - name: Question A option 1 in native (N separate processes)
        working-directory: spikes/spike3-hosting
        run: |
          if [ ! -x target/spike3-hosting-1.0.0-SNAPSHOT-runner ]; then echo "no native binary"; exit 0; fi
          for n in 1 5 20; do bash ci/processes.sh native $n; done | tee ../../out/processes-native.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike3-hosting-results
          path: out/
          if-no-files-found: warn
