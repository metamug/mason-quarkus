# resource folder: set QUARKUS_MQ_DIR when starting (CI points it at samples/shop-sql/mq)
quarkus.mq.dir=mq
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${MQ_DB_URL:jdbc:postgresql://localhost:5432/mqtest}
quarkus.datasource.username=${MQ_DB_USER:postgres}
quarkus.datasource.password=${MQ_DB_PASSWORD:postgres}
